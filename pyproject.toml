[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "locqa"
version = "0.1.0"
description = "Localization QA for Flutter ARB files: compares a source ARB with a target ARB and reports issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
llm = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
locqa = "locqa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/locqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic and Kazakh letters are intended
